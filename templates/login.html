{{define "content"}}
<div class="panel narrow">
  <h1>Sign in</h1>
  <p class="muted">Enter your {{range $i, $d := .Data.Domains}}{{if $i}} or {{end}}@{{$d}}{{end}} address. We email you a one-time code.</p>
  {{if .Data.Error}}<p class="error" role="alert">{{.Data.Error}}</p>{{end}}
  <form method="post" action="/login">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" value="{{.Data.Email}}" autocomplete="email" required autofocus>
    <button class="btn">Email me a code</button>
  </form>
  <p class="muted small">Are you an agent? Read <a href="/llms.txt">/llms.txt</a>.</p>
</div>
{{end}}
